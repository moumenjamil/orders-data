# The data team's CI/CD: every push to main and every PR commit is
# deployed to the Astronomer Deployment, and GitHub is told the commit is
# live (a GitHub deployment with status "success", environment
# "astro-ci"), exactly as an app's CI does. Argus waits for that before it
# tests a PR's data (the same deployment gate as for web/BE repos).
#
# Lab setup: one Deployment, so a PR's commit replaces what runs there
# until the next deploy. Teams with more budget use one preview
# Deployment per PR.
name: Deploy to Astro

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: write

concurrency:
  group: astro-ci            # one deploy at a time to the one Deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Record the deployed commit next to the DAGs
        run: echo "$COMMIT" > dags/.deployed_commit

      - name: Tell GitHub a deployment of this commit started
        id: gh_deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # required_contexts [] : do not wait for other checks to create it
          id=$(jq -n --arg ref "$COMMIT" \
                 '{ref:$ref, environment:"astro-ci", auto_merge:false, required_contexts:[], description:"Astro deploy"}' \
               | gh api "repos/${{ github.repository }}/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -f state=in_progress >/dev/null

      - name: Install Astro CLI
        if: vars.AIRFLOW_HOST != 'local'
        uses: astronomer/setup-astro-cli@v0.0.1

      - name: Deploy to Astro
        if: vars.AIRFLOW_HOST != 'local'
        uses: astronomer/deploy-action@v0.14.0
        with:
          deployment-id: ${{ vars.ASTRO_DEPLOYMENT_ID }}
          deploy-type: image-and-dags
          # Always deploy: by default the action skips a push that changes
          # no project files (an empty or docs-only commit), and this job
          # would then report a commit as live that never was.
          skip-unchanged: false
          wake-on-deploy: true

      - name: Keep the CI environment awake while the PR is tested
        if: vars.AIRFLOW_HOST != 'local'
        # A Development deployment hibernates and a deploy ends a wake-up
        # override; "live" must mean Airflow answers, so wake it for 2 h
        # and wait until it is HEALTHY before telling GitHub (D7-32).
        run: |
          astro deployment wake-up "${{ vars.ASTRO_DEPLOYMENT_ID }}" --for 2h
          for i in $(seq 1 36); do
            s=$(astro deployment inspect "${{ vars.ASTRO_DEPLOYMENT_ID }}" --key metadata.status)
            echo "status: $s"
            [ "$s" = "HEALTHY" ] && exit 0
            sleep 10
          done
          echo "the deployment did not become HEALTHY within 6 minutes"; exit 1

      - name: Stand-in deploy (Airflow on the team's machine)
        # D7-43: while Astronomer is off, Airflow runs on the team's
        # machine and reads the checkout there (deploy-local.sh records
        # the commit). Set the repo variable AIRFLOW_HOST back to empty
        # to deploy to Astronomer again.
        if: vars.AIRFLOW_HOST == 'local'
        run: echo "commit $COMMIT is deployed by deploy-local.sh on the team's machine"

      - name: Deploy the Glue job's code to S3
        # D7-45: the AWS pipeline's transformation runs as the Glue job
        # orders-daily-curate, which reads its code from S3. The pipeline's
        # own AWS login (repo secrets) uploads it; the repo variable
        # AWS_GLUE_SCRIPTS_URI (s3://.../glue-scripts/) turns this step on.
        # Lab setup: one job, so a PR's code replaces what runs there until
        # the next deploy, as with the one Airflow.
        if: vars.AWS_GLUE_SCRIPTS_URI != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PIPELINE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PIPELINE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws s3 cp glue/orders_daily_curate.py "${{ vars.AWS_GLUE_SCRIPTS_URI }}orders_daily_curate.py"
          echo "$COMMIT" | aws s3 cp - "${{ vars.AWS_GLUE_SCRIPTS_URI }}orders_daily_curate.commit"

      - name: Tell GitHub the commit is live
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deploy.outputs.id }}/statuses" -f state=success -f environment=astro-ci >/dev/null

      - name: Tell GitHub the deploy failed
        if: failure() && steps.gh_deploy.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deploy.outputs.id }}/statuses" -f state=failure >/dev/null
