# orders_live from the order event stream on Amazon MSK (S4, Kafka on each cloud): the same stream processor
# (streaming/processor.py) as orders-live-stream.yml, reading the MSK cluster's public brokers and keeping
# orders_live_msk in MySQL. MSK's IAM login: OAUTHBEARER signed with the processor's AWS key
# (user assertix-lab-msk-processor); Amazon's certificate is publicly trusted (no CA file).
# On only while the lab cluster exists (vars.MSK_BOOTSTRAP, set by set-msk-keys.sh).
#  - every PR: the PR's processor on the TEST topic (order-events-ci -> ci.orders_live_msk)
#  - main and every hour: the production topic (order-events -> dev.orders_live_msk), drained, then stops
name: orders-live-msk
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: orders-live-msk-${{ github.event_name == 'pull_request' && 'ci' || 'prod' }}
  cancel-in-progress: false
jobs:
  run:
    if: vars.MSK_BOOTSTRAP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      PIPELINE_ID: orders-live-msk
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASSERTIX_URL: ${{ vars.ASSERTIX_URL }}
      ASSERTIX_WEBHOOK_SECRET: ${{ secrets.ASSERTIX_WEBHOOK_SECRET }}
      PR: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: start
        run: |
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          pip install --quiet confluent-kafka==2.6.1 PyMySQL==1.1.1 aws-msk-iam-sasl-signer-python==1.0.2
      - name: report running
        run: STARTED_AT=$STARTED_AT python mysql/report_run.py running
      - name: orders_live
        id: job
        env:
          KAFKA_BOOTSTRAP: ${{ vars.MSK_BOOTSTRAP }}
          KAFKA_MECHANISM: AWS_MSK_IAM
          KAFKA_REGION: eu-north-1
          AWS_ACCESS_KEY_ID: ${{ secrets.MSK_PROCESSOR_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MSK_PROCESSOR_SECRET }}
          TABLE: orders_live_msk
          TOPIC: ${{ env.PR == 'yes' && 'order-events-ci' || 'order-events' }}
          DLQ_TOPIC: ${{ env.PR == 'yes' && 'order-events-dlq-ci' || 'order-events-dlq' }}
          GROUP: ${{ env.PR == 'yes' && 'orders-live-msk-ci' || 'orders-live-msk' }}
          TARGET: ${{ env.PR == 'yes' && 'ci' || 'dev' }}
          FIRST_WAIT: ${{ env.PR == 'yes' && '600' || '60' }}
          IDLE: ${{ env.PR == 'yes' && '180' || '20' }}   # S4: 3 min after a test's events (a PR's next test on it may follow)
          MYSQL_HOST: ${{ vars.MYSQL_HOST }}
          MYSQL_PORT: ${{ vars.MYSQL_PORT }}
          MYSQL_USER: orders_pipeline
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PIPELINE_PASSWORD }}
        run: python streaming/processor.py
      - name: report the result
        if: always()
        run: python mysql/report_run.py ${{ steps.job.outcome == 'success' && 'success' || (steps.job.outcome == 'cancelled' && 'cancelled' || 'failed') }}
