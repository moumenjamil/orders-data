# Targets mirror a team setup: dev (personal), ci (PR validation),
# prod. Each builds into the warehouse schema of the same name.
# snowflake: the same models in Snowflake ORDERS_DB.CI (D7-43).
# bigquery: the same models in BigQuery dataset orders_lab (T2, D7-49).
# Credentials come only from environment variables. DBT_WH_SSLMODE:
# 'prefer' (local lab) unless set, 'require' for a cloud warehouse.
argus_lab:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_WH_HOST') }}"
      port: "{{ env_var('DBT_WH_PORT') | int }}"
      dbname: "{{ env_var('DBT_WH_DBNAME') }}"
      user: "{{ env_var('DBT_WH_USER') }}"
      password: "{{ env_var('DBT_WH_PASSWORD') }}"
      sslmode: "{{ env_var('DBT_WH_SSLMODE', 'prefer') }}"
      schema: dev
      threads: 2
    ci:
      type: postgres
      host: "{{ env_var('DBT_WH_HOST') }}"
      port: "{{ env_var('DBT_WH_PORT') | int }}"
      dbname: "{{ env_var('DBT_WH_DBNAME') }}"
      user: "{{ env_var('DBT_WH_USER') }}"
      password: "{{ env_var('DBT_WH_PASSWORD') }}"
      sslmode: "{{ env_var('DBT_WH_SSLMODE', 'prefer') }}"
      schema: ci
      threads: 2
    prod:
      type: postgres
      host: "{{ env_var('DBT_WH_HOST') }}"
      port: "{{ env_var('DBT_WH_PORT') | int }}"
      dbname: "{{ env_var('DBT_WH_DBNAME') }}"
      user: "{{ env_var('DBT_WH_USER') }}"
      password: "{{ env_var('DBT_WH_PASSWORD') }}"
      sslmode: "{{ env_var('DBT_WH_SSLMODE', 'prefer') }}"
      schema: prod
      threads: 2
    # Same models on Snowflake (D7-43): key-pair login, no password.
    # DBT_SF_PRIVATE_KEY is the key body (base64), set as an Astro secret.
    snowflake:
      type: snowflake
      account: "{{ env_var('DBT_SF_ACCOUNT', '') }}"
      user: "{{ env_var('DBT_SF_USER', '') }}"
      private_key: "{{ env_var('DBT_SF_PRIVATE_KEY', '') }}"
      role: PIPELINE_ROLE
      warehouse: ORDERS_WH
      database: ORDERS_DB
      schema: CI
      threads: 2
    # Same models on BigQuery (T2, D7-49): the pipeline's service account
    # key, written by the DAG from the Airflow connection lab_gcp for the
    # run (never in the repo); a cap on what one query may bill.
    bigquery:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('DBT_BQ_KEYFILE', '') }}"
      project: "{{ env_var('DBT_BQ_PROJECT', '') }}"
      dataset: orders_lab
      location: europe-west3
      maximum_bytes_billed: 1000000000
      threads: 2
